[project]
name = "vaminer"
version = "0.1.0"
description = "VAMINER: Issue‑Directed Variant Analysis Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.57",
    "httpx>=0.28.1",
    "json-repair>=0.61.7",
    "langfuse>=4.14.1",
    "pydantic>=2.13.4",
    "pydantic-ai-harness>=0.11.0",
    "pydantic-ai-slim[duckduckgo,openai,web-fetch]>=2.18.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["test"]
